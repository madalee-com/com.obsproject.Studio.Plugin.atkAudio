app-id: com.obsproject.Studio.Plugin.atkAudio
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
# build-extension produces a runtime extension, not an app; it has no runnable command,
# so `command:` must be omitted (setting it caused flatpak-builder to fail at "Command 'obs' not found").
build-extension: true
separate-locales: false
# The OBS runtime provides libobs/obs-frontend-api (atkAudio finds them via pkg-config + /usr/include fallback).
# Qt6 is provided by a `qt6` module built from source below and installed into /app; the plugin links THAT
# build (same obs-deps-built ABI as OBS's runtime) instead of the SDK's divergent /usr/lib/qt6 build.

build-options:
  prefix: /app/plugins/atkAudio
  cflags: -Wno-error

modules:
  # Build obs-deps-ABI-matching Qt 6.11.1 from source into /app. OBS's flatpak bundles this exact Qt
  # (obsproject/obs-deps 2026-08-26); no Linux prebuilt exists, so we rebuild it here in flatpak-builder.
  # The plugin then links THIS copy via CMAKE_PREFIX_PATH=/app + QT_DIR, giving one consistent Qt build
  # in-process and eliminating the JUCE Component vtable drift that crashes juce::Component::centreWithSize.
  - name: qt6
    buildsystem: cmake-buildsystem
    no-autogen: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_WITH_PRL=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DQT_BUILD_EXAMPLES=OFF
      - -DINSTALL_DOCS=OFF
      # xcb platform plugin (Linux windowing). OpenGL for JUCE rendering. ICU + fontconfig from build-deps.
      - -DQT_FEATURE_opengl=on
      - -DQT_FEATURE_opengles3=on
      - -DQT_FEATURE_xcb=true
      - -DCMAKE_CXX_STANDARD=17
    build-options:
      env:
        MAKEFLAGS: "-j$(nproc)"
    modules:
      - name: qt6-sdk-deps
        buildsystem: simple
        build-commands: []
    build-deps:
      # Qt xcb/GL/icu/alsa/dbus dev headers provided by the org.freedesktop.Sdk extension.
      - gtk3

  - name: atkaudio-plugin
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      # atkAudio 0.35.0's CMakeLists does `if(BUILD_TESTING) add_subdirectory(tests)` but ships no tests/ dir,
      # so this guard must be disabled to configure successfully.
      - -DBUILD_TESTING=OFF
      # JUCE is pre-fetched as the _deps/juce-src module above and patched inline; force FetchContent to
      # reuse that existing checkout instead of attempting a network fetch (fails in sandboxed CI).
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      # Root fix for the Qt ABI drift crash: OBS's flatpak bundles obs-deps' own Qt 6.11.1 (verified from
      # obsproject/obs-deps release 2026-08-26; NO Linux prebuilt exists, only mac/win). That build is
      # produced by a `qt6` module built in this same flatpak-builder run and installed under /app. Point
      # find_package(Qt6 Widgets Core REQUIRED) at it via CMAKE_PREFIX_PATH=/app + QT_DIR so JUCE links the
      # SAME obs-deps-built Qt6 ABI OBS uses at runtime -> one Qt build in-process -> no JUCE Component vtable
      # drift -> centreWithSize stops segfaulting. The SDK /usr/lib/qt6 build is the drift source and is not
      # used (the old -DQT_DIR=/usr/lib/qt6 line was removed). Patch 0003 still defers MainHostWindow
      # construction off the OBS module thread as a safety net.
      - -DCMAKE_PREFIX_PATH=/app
      - -DQT_DIR=/app/lib/cmake/Qt6
    build-commands:
      - |
        mkdir packages
    post-install:
      - |
        # Release tag name is 'atkaudio-pluginforobs' (buildspec.json), not the app-id;
        # CMake builds atkaudio-pluginforobs.so, so install that artifact.
        install -Dm644 --target-directory=${FLATPAK_DEST}/lib/obs-plugins atkaudio-pluginforobs.so
    sources:
      - type: git
        url: https://github.com/atkAudio/PluginForObsRelease.git
        tag: 0.35.0
        # atkAudio's root CMakeLists does add_subdirectory(src) and builds a MODULE lib + main plugin lib.
      - type: git
        url: https://github.com/juce-framework/JUCE.git
        tag: 9.0.3
        dest: _deps/juce-src
      # Inline patch JUCE 9.0.3 to add the flatpak /app/extensions/Plugins/* default search paths.
      # flatpak-builder extracts every module source into one build dir and runs `patch -p1` from
      # there; JUCE was fetched to _deps/juce-src, so each git header is prefixed with that path
      # (`a/_deps/juce-src/modules/...`) so `-p1` resolves it relative to the build root.
      - type: patch
        path: 0003-defer-main-window-construction-to-message-thread.patch
      # Defer MainHostWindow window-peer/geometry construction off the OBS module thread onto the
      # JUCE message thread. On Linux these ops (setResizable, centreWithSize->setBoundsConstrained,
      # restoreWindowStateFromString) crash at plugin init before a consistent Qt GUI context exists.
      # flatpak-builder applies patches with `patch -p1` from the build root, so headers are b/... paths.
      - type: patch
        path: 0001-fix-add-flathub-PATHS-to-JUCE.patch
