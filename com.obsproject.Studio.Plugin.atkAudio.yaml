app-id: com.obsproject.Studio.Plugin.atkAudio
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
# build-extension: true builds the module against org.freedesktop.Sdk//25.08 WITHOUT requiring the OBS runtime
# installed in the build container — `build-extension: only` would demand the OBS runtime be present
# ("com.obsproject.Studio/... not installed"). The slim ~17MB artifact comes from bundling a fresh archive-z2 repo
# that contains ONLY the extension commit (see .github/workflows/build-flatpak.yaml, which re-commits the ext tree
# under an `ext/` ref before build-bundle).
build-extension: true
separate-locales: false
# The OBS runtime provides libobs/obs-frontend-api AND its own bundled Qt6 (obsproject/obs-deps 2026-08-26). A
# build-extension links against the SDK's /usr/lib/qt6, which is a DIFFERENT Qt build with a different ABI than
# OBS's in-process obs-deps Qt6. When JUCE loads the plugin into OBS the two Qt ABIs collide (JUCE Component
# vtable drift) and the plugin crashes at load — e.g. juce::Component::centreWithSize segfaults.
# Fix: rebuild the SAME obs-deps Qt6 6.11.1 OBS bundles into /app via the `qt6` module below, and point JUCE's
# find_package(Qt6) at it (CMAKE_PREFIX_PATH=/app + QT_DIR=/app/lib/cmake/Qt6). Build-time Qt == OBS runtime Qt =>
# one consistent Qt in-process => no ABI drift => plugin loads. This mirrors how the working obs-multi-rtmp plugin
# links Qt via -DENABLE_QT=ON against the OBS runtime's Qt instead of the SDK's divergent build.

build-options:
  prefix: /app/plugins/atkAudio
  cflags: -Wno-error

modules:
  # Rebuild obsproject/obs-deps Qt6 6.11.1 from source into /app so the plugin links the EXACT same Qt ABI that
  # OBS bundles in its runtime (there is no Linux prebuilt; only mac/win ship binaries). This eliminates the SDK
  # /usr/lib/qt6 ABI drift that crashed the plugin at load. Installed under /app, pruned below after the plugin
  # links against it.
  - name: qt6
    buildsystem: cmake-buildsystem
    no-autogen: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS:BOOL=OFF
      # Static Qt (BUILD_SHARED_LIBS=OFF) is what OBS bundles; the plugin then links these static libs, giving one
      # consistent Qt build in-process. Platform features OBS actually needs at runtime.
      - -DQT_BUILD_TESTS=OFF
      - -DQT_BUILD_EXAMPLES=OFF
      - -DINSTALL_DOCS=OFF
      - -DQT_BUILD_TOOLS_BY_DEFAULT=OFF
      - -DQT_FEATURE_opengl=on
      - -DQT_FEATURE_opengles3=on
      - -DQT_FEATURE_xcb=true
      - -DCMAKE_CXX_STANDARD=17
    build-options:
      env:
        MAKEFLAGS: "-j$(nproc)"
    modules:
      - name: qt6-sdk-deps
        buildsystem: simple
        build-commands: []
    build-deps:
      # Qt xcb/GL/icu/alsa/dbus dev headers provided by the org.freedesktop.Sdk extension.
      - gtk3

  - name: atkaudio-plugin
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      # Release build type omits the -g flag, so no .debug_* sections (debug symbols) are emitted. This replaced
      # RelWithDebInfo, which added -g and left debug symbols in the plugin. The flatpak-builder action does not
      # support a `strip` input (it warns "Unexpected input(s) 'strip'"), so stripping is handled here at build time.
      # atkAudio's CMakeLists.txt AND cmake/common/bootstrap.cmake both FORCE the default to RelWithDebInfo via
      # `set(CMAKE_BUILD_TYPE "RelWithDebInfo" CACHE STRING ... FORCE)` guarded by `if(NOT CMAKE_BUILD_TYPE)`. A
      # plain `-DCMAKE_BUILD_TYPE=Release` already defeats that guard (the cache var is set), but we also FORCE it to
      # be certain, and unset ATK_DEBUG so the upstream target_policies.cmake gate can't add -g.
      - -DCMAKE_BUILD_TYPE:STRING=Release
      - -DATK_DEBUG=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      # atkAudio 0.35.0's CMakeLists does `if(BUILD_TESTING) add_subdirectory(tests)` but ships no tests/ dir,
      # so this guard must be disabled to configure successfully.
      - -DBUILD_TESTING=OFF
      # JUCE is pre-fetched as the _deps/juce-src module above and patched inline; force FetchContent to
      # reuse that existing checkout instead of attempting a network fetch (fails in sandboxed CI).
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      # Root fix for the Qt ABI drift crash: OBS's flatpak bundles obsproject/obs-deps' own Qt6 6.11.1 (there is no
      # Linux prebuilt, only mac/win). That build is produced by the `qt6` module in this same flatpak-builder run
      # and installed under /app. Point find_package(Qt6 Widgets Core REQUIRED) at it via CMAKE_PREFIX_PATH=/app +
      # QT_DIR so JUCE links the SAME obs-deps-built Qt6 ABI OBS uses at runtime => one Qt build in-process => no
      # JUCE Component vtable drift => centreWithSize stops segfaulting. The SDK /usr/lib/qt6 build is the drift
      # source and is not used here.
      - -DCMAKE_PREFIX_PATH=/app
      - -DQT_DIR=/app/lib/cmake/Qt6
    build-commands:
      - |
        mkdir packages
    post-install:
      - |
        # Release tag name is 'atkaudio-pluginforobs' (buildspec.json), not the app-id;
        # CMake builds atkaudio-pluginforobs.so, so install that artifact.
        install -Dm644 --target-directory=${FLATPAK_DEST}/lib/obs-plugins atkaudio-pluginforobs.so
        # Strip symbols: the Release build has no .debug_* sections, so this removes only the symbol table (~21 MB
        # -> ~17.2 MB), yielding a slim distributable plugin with comfortable margin under the 25MB gate.
        strip --strip-all ${FLATPAK_DEST}/lib/obs-plugins/atkaudio-pluginforobs.so
        # The Qt6 module installed a full static-Qt tree under /app (used only to link the plugin). It is NOT part
        # of the runtime plugin and must be removed before bundling, otherwise the ~30 MB of Qt objects becomes
        # large static deltas -> bloat beyond the 25MB gate. Remove it now that the plugin has linked against it.
        rm -rf "${FLATPAK_DEST}/lib/cmake/Qt6" \
               "${FLATPAK_DEST}/lib/*.a" \
               "${FLATPAK_DEST}/lib/libqt*" \
               "${FLATPAK_DEST}/include" \
               "${FLATPAK_DEST}/share/qt6"
        # The Linux install rule also installs SECOND, unstripped copies of the plugin and scanner into
        # obs-plugins/${_portable_arch}/ (obs-plugins/64bit/) plus install.sh and a share/ tree. flatpak
        # build-bundle re-encodes that extra ~20 MB as large static deltas -> bloat. Remove exactly those stray
        # runtime-style paths, keeping ONLY this single stripped plugin under lib/obs-plugins/ so the bundle stays
        # slim (~17 MB < 25MB gate). Explicit path removal avoids find -delete's refusal to delete a still-non-empty
        # parent directory (which failed the build earlier).
        rm -rf "${FLATPAK_DEST}/obs-plugins/64bit" \
               "${FLATPAK_DEST}/install.sh" \
               "${FLATPAK_DEST}/share"
    sources:
      - type: git
        url: https://github.com/atkAudio/PluginForObsRelease.git
        tag: 0.35.0
        # atkAudio's root CMakeLists does add_subdirectory(src) and builds a MODULE lib + main plugin lib.
      - type: git
        url: https://github.com/juce-framework/JUCE.git
        tag: 9.0.3
        dest: _deps/juce-src
      # Inline patch JUCE 9.0.3 to add the flatpak /app/extensions/Plugins/* default search paths.
      # flatpak-builder extracts every module source into one build dir and runs `patch -p1` from
      # there; JUCE was fetched to _deps/juce-src, so each git header is prefixed with that path
      # (`a/_deps/juce-src/modules/...`) so `-p1` resolves it relative to the build root.
      - type: patch
        path: 0001-fix-add-flathub-PATHS-to-JUCE.patch
