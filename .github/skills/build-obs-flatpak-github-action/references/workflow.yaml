# TEMPLATE — copy to .github/workflows/<name>.yaml and edit the <PLACEHOLDER> values.
# Based on the working atkAudio OBS plugin build. See SKILL.md for why each piece exists.
on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags:
      - 'v*'                # pushing v0.35.0 also triggers build + auto-release
name: Build OBS Plugin Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build env: pinned ubuntu + the flathub-infra runtime
    # image reproduces the com.obsproject.Studio build environment.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # Line number of the plugin source module's tag: (1 == atkAudio, 2 == JUCE). Adjust <N>.
          VER=$(grep -E '^\s+tag:' <manifest>.yaml | sed -n '<N>p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      # build-bundle: false is the whole point — see SKILL.md point #2. Auto-bundle emits a
      # static-delta ostree (bloat 100-117MB). We bundle from the export repo ourselves below.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: <manifest>.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain, slim extension bundle (~10-20MB, no static deltas). Bundle directly from
      # flatpak-builder's export repo (no --runtime-repo) so no OBS-platform delta base is emitted.
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.<org>.<Plugin>.atkAudio          # your app-id
          REF="runtime/${ID}/x86_64/stable"         # initial guess; overridden from ostree refs below
          # flatpak-builder's export repo/ holds the plugin commit under this runtime ref. Anchor on
          # the plugin-unique ".Plugin.<name>" substring AND the trailing "/x86_64/stable"; this cannot
          # match the OBS platform ref "com.obsproject.Studio/x86_64/stable" (ext refs are rejected there).
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "\.Plugin\.atkAudio/x86_64/stable$" || true)
          if [ -z "$REF" ]; then
            echo "ERROR: no ${ID} runtime ref in flatpak-builder export repo"; \
              ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          VER=$(grep -E '^\s+tag:' <manifest>.yaml | sed -n '<N>p' | awk '{print $2}' | tr -d '[:space:]')
          echo "Building plain bundle from flatpak-builder export repo ref=$REF tag=${VER}"
          flatpak build-bundle repo out-<ver>-for-OBS-${VER}.flatpak "$REF" stable
          ls -lh out-<ver>-for-OBS-${VER}.flatpak
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: out-<ver>-for-OBS-${{ steps.version.outputs.version }}.flatpak
          path: out-<ver>-for-OBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # fetch-depth: 0 is REQUIRED so `git log` has full history; the default shallow depth-1 clone
      # yields only HEAD, producing an empty changelog body. Plain checkout at the workflow ref is
      # enough (a hardcoded ref: broke on workflow_dispatch with no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' <manifest>.yaml | sed -n '<N>p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" \
              '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "# <Plugin> Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: <Plugin> Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/out-<ver>-for-OBS-${{ steps.version.outputs.version }}.flatpak
