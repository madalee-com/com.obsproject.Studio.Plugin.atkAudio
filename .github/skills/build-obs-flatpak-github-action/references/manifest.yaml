# TEMPLATE — copy to <app-id>.yaml and adapt module URLs/tags/paths for your OBS plugin.
# Annotated with the learnings from com.obsproject.Studio.Plugin.atkAudio. See SKILL.md.

app-id: com.<org>.<Plugin>.atkAudio
branch: stable
runtime: com.obsproject.Studio        # host runtime providing libobs/obs-frontend-api at RUNTIME
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08       # build-time Qt == runtime SDK Qt => no ABI drift for JUCE

# build-extension: true builds against the Sdk WITHOUT needing the OBS runtime installed in CI
# (avoids "com.obsproject.Studio/... not installed"). A build-extension emits its own .metadata with
# a [Runtime] block, but that block does NOT pull the runtime into the bundle (content-only export).
build-extension: true
separate-locales: false

# IMPORTANT: do NOT list the OBS runtime in runtime-extensions. Leaving it [] keeps the runtime out of
# the bundle; the runtime provides libobs at runtime via the host's com.obsproject.Studio ref.
runtime-extensions: []

build-options:
  prefix: /app/plugins/atkAudio
  cflags: -Wno-error

modules:
  - name: <plugin-module>
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      # Release + no debug => no .debug_* sections (flatpak-builder action has no `strip` input; it
      # warns "Unexpected input(s) 'strip'", so we strip at build time instead).
      - -DCMAKE_BUILD_TYPE:STRING=Release
      - -DATK_DEBUG=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      # Some upstream CMakeLists do add_subdirectory(tests) with no tests/ dir -> disable to configure.
      - -DBUILD_TESTING=OFF
      # JUCE is pre-fetched as the _deps module; force FetchContent to reuse it (no network in CI).
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
    build-commands:
      - mkdir packages
    post-install:
      - |
        # The upstream release tag name may differ from the app-id (e.g. 'atkaudio-pluginforobs'
        # from buildspec.json). Install THAT artifact, then strip it.
        install -Dm644 --target-directory=${FLATPAK_DEST}/lib/obs-plugins <built-plugin>.so
        strip --strip-all ${FLATPAK_DEST}/lib/obs-plugins/<built-plugin>.so
        # Upstream's Linux install rule may ALSO drop stray runtime-style paths (obs-plugins/<arch>/,
        # install.sh, share/) that flatpak build-bundle re-encodes as large static deltas -> 64MB bloat.
        # Remove exactly those, keeping ONLY the stripped plugin under lib/obs-plugins/. Use explicit rm -rf;
        # `find -delete` refuses to delete a still-non-empty parent dir and fails the build.
        rm -rf "${FLATPAK_DEST}/obs-plugins" \
               "${FLATPAK_DEST}/install.sh" \
               "${FLATPAK_DEST}/share"
    sources:
      # ---- plugin source: release version lives on THIS module's tag: (adjust <N> in CI) ----
      - type: git
        url: https://github.com/<org>/<PluginReleaseRepo>.git
        tag: 0.35.0
      # ---- JUCE dependency (patched inline below; headers must be prefixed with this dest path) ----
      - type: git
        url: https://github.com/juce-framework/JUCE.git
        tag: 9.0.3
        dest: _deps/juce-src
      # Inline patch JUCE to add flatpak /app/extensions/Plugins/* search paths.
      # flatpak-builder runs `patch -p1` from the build root, so each git header must be prefixed with
      # the dest path (a/_deps/juce-src/modules/...) so -p1 resolves it relative to the build root.
      - type: patch
        path: 0001-fix-add-flathub-PATHS-to-JUCE.patch
      # Inline patch to fix a load-time crash / behavior in the plugin (e.g. defer QWidget geometry ops
      # onto the JUCE message thread). Header paths must match this source's layout, prefixed with its
      # dest path if it lives under _deps/...
      - type: patch
        path: 0003-defer-main-window-construction-to-message-thread.patch
