on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # pushing v0.35.0 also triggers a build + auto-release
name: CI Build Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # atkAudio source tag (line 49 of the manifest) is the release version.
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          # Do NOT let the action auto-bundle: its `flatpak build-bundle --runtime --runtime-repo=<flathub>`
          # emits a static-delta ostree bundle (deltas/av/0..4 + update metadata) that bloats the release
          # artifact to ~100-117MB. We build the extension ourselves below and emit a plain ~17MB bundle.
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain extension bundle (~17MB, no static-delta bloat).
      #
      # A build-extension always emits its own .metadata with a [Runtime] block, but that block does NOT cause the
      # runtime to be embedded into the bundle (host-verified: a fresh archive-z2 repo + an `ext/<id>/x86_64/stable`
      # ref bundles content-only). The old ~90-117MB artifact came from static-delta base blobs of the OBS platform
      # that flatpak-builder pulled into the export repo when auto-bundling (build-bundle: true, with --runtime-repo).
      # We avoid that by NOT auto-bundling and by bundling only a fresh archive-z2 repo that holds the extension
      # commit under an `ext/` ref — no platform objects are reachable, so no static-delta base can be emitted =>
      # bundle is ~17MB with no deltas/av-style header paths. Stripping [Runtime] from the ext .metadata here is
      # cosmetic (no size impact) but keeps the bundle a clean runtime-less plugin extension, which is what OBS
      # loads into its running host at install time.
      - name: Build extension-only repo (strip embedded OBS platform)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          # CI's export repo (repo/) contains this plugin's runtime commit:
          #   runtime/com.obsproject.Studio.Plugin.atkAudio/x86_64/stable
          # Note the ref STARTS WITH "runtime/" (not "ext/"), so any pattern anchored at the bare app-id
          # fails. Anchor on the plugin-unique ".Plugin.atkAudio" substring AND require the trailing
          # "/x86_64/stable"; this cannot match the OBS platform ref "com.obsproject.Studio/x86_64/stable".
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "\.Plugin\.atkAudio/x86_64/stable$" || true)
          if [ -z "$REF" ]; then
            echo "ERROR: no ${ID} extension ref in export repo"; ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          echo "selected plugin ref $REF = $COMMIT"
          # Sanity: the commit must be a slim extension tree. The full OBS platform app has thousands of tree
          # entries; this plugin has far fewer. If we accidentally picked a huge tree, bail instead of
          # shipping a bloated bundle.
          N=$(ostree --repo=repo ls -R "$COMMIT" 2>/dev/null | wc -l)
          echo "plugin commit tree entries = $N"
          if [ "$N" -gt 2000 ]; then
            echo "ERROR: selected commit is unexpectedly large (${N} entries) -- not an extension"; exit 1
          fi
          rm -rf extrepo workdir
          # Checkout the extension tree into a FRESH archive-z2 repo that contains ONLY the extension objects
          # (no platform objects present). No runtime installed is needed for a plain archive-z2 ostree commit.
          ostree --repo=extrepo init --mode=archive-z2 >/dev/null 2>&1
          ostree --repo=repo checkout "$COMMIT" workdir >/dev/null 2>&1
          # Strip the vestigial [Runtime] block from the extension .metadata so the bundled extension declares no
          # runtime (OBS loads it as a plugin). Host-verified: cosmetic, no size impact.
          awk '/^\[Runtime\]$/{inrt=1; next} inrt && /^$/{inrt=0; next} !inrt{print}' \
            workdir/.metadata > workdir/.metadata.tmp 2>/dev/null && mv workdir/.metadata.tmp workdir/.metadata 2>/dev/null || true
          # Re-commit under an EXTENSION ref (ext/<id>/...). Bundling an `ext/` ref makes flatpak treat this
          # as a plugin extension with NO required runtime in the bundle, so the OBS platform cannot be
          # emitted as a static-delta base. (Bundling under a `runtime/` ref is what pulled the whole runtime
          # into the original ~90MB bloat.)
          FRESH=$(ostree --repo=extrepo commit --branch="ext/${ID}/x86_64/stable" \
                    --subject="atkAudio plugin extension" workdir 2>/dev/null | tail -1)
          echo "fresh ext-only commit = $FRESH"
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "Building plain extension bundle for ${ID} (ext-only commit) tag=${VER}"
          flatpak build-bundle extrepo atkAudioForOBS-${VER}.flatpak \
            "ext/${ID}/x86_64/stable" stable
          ls -lh atkAudioForOBS-${VER}.flatpak
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          path: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # Check out the repo so we can read the manifest (for the version) and build
      # the changelog from git history. fetch-depth: 0 is required so `git log` has
      # full history; the default shallow depth-1 clone yields only HEAD, producing an
      # empty changelog body. Plain checkout at the workflow ref is enough; a hardcoded
      # `ref:` broke on workflow_dispatch (no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # If a previous release tag exists, summarize commits since it; otherwise fall back to recent history.
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# atkAudio Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: atkAudio Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
      - name: Verify plain bundle (no static-delta metadata)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          F="release/atkAudioForOBS-${VER}.flatpak"
          ls -lh "$F"
          SIZE_BYTES=$(stat -c%s "$F")
          echo "  size_bytes=$SIZE_BYTES"
          # Size gate: a plain extension bundle's .files layer is ~17MB. Bloat (static-delta runtime rebuild)
          # pushed it to ~117MB, so fail loudly if it grows past the expected ceiling.
          if [ "$SIZE_BYTES" -gt 26214400 ]; then
            echo "ERROR: bundle larger than 25MB ($SIZE_BYTES bytes) — likely static-delta bloat"; exit 1
          fi
          # Static-delta bundles embed 'deltas/<ver>/<hash>/n' blob paths in the NUL-separated header.
          # grep is line-based and these live inside a binary header, so translate NULs to newlines first.
          # Use process substitution (not a pipe) so tr's SIGPIPE exit isn't caught by `set -o pipefail`
          # when grep -q matches early; otherwise the check would always report "no deltas" (false pass).
          # Real delta hashes contain '_' and '+', so [A-Za-z0-9]+ must be replaced by [^/]+ to match.
          # flatpak build-bundle ALWAYS emits one tiny benign delta even for a clean slim bundle, so only
          # fail when the bundle exceeds the slim target — i.e. real bloat (leaked runtime / stray copy).
          if grep -aqE 'deltas/[a-z]{2}/[^/]+/[^/]+' <(tr '\0' '\n' < "$F"); then
            if [ "$SIZE_BYTES" -gt 26214400 ]; then
              echo "ERROR: bundle contains large static deltas (>25MB, $SIZE_BYTES bytes) — runtime bloat"; exit 1
            fi
            echo "  note: tiny benign static delta present in slim bundle (expected), size within gate"
          fi
