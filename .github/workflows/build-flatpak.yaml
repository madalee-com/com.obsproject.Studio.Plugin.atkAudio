on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # pushing v0.35.0 also triggers a build + auto-release
name: CI Build Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # atkAudio source tag (line 49 of the manifest) is the release version.
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          # Do NOT let the action auto-bundle: its `flatpak build-bundle --runtime --runtime-repo=<flathub>`
          # emits a static-delta ostree bundle (deltas/av/0..4 + update metadata) that bloats the release
          # artifact to ~100-117MB. We build the extension ourselves below and emit a plain ~17MB bundle.
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain extension bundle (~17MB, no static-delta bloat).
      #
      # A build-extension always emits its own .metadata with a [Runtime] block, but that block does NOT cause the
      # runtime to be embedded into the bundle (host-verified: a fresh archive-z2 repo + an `ext/<id>/x86_64/stable`
      # ref bundles content-only). The old ~90-117MB artifact came from static-delta base blobs of the OBS platform
      # that flatpak-builder pulled into the export repo when auto-bundling (build-bundle: true, with --runtime-repo).
      # We avoid that by NOT auto-bundling and by bundling only a fresh archive-z2 repo that holds the extension
      # commit under an `ext/` ref — no platform objects are reachable, so no static-delta base can be emitted =>
      # bundle is ~17MB with no deltas/av-style header paths. We KEEP the [Runtime]/[ExtensionOf] block in the
      # extension .metadata: OBS reads `runtime = com.obsproject.Studio/x86_64/stable` from it to bind the plugin
      # to the running OBS host, so stripping it broke install/load (it was NOT cosmetic).
      - name: Build extension-only repo (strip embedded OBS platform)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          # CI's export repo (repo/) contains this plugin's runtime commit:
          #   runtime/com.obsproject.Studio.Plugin.atkAudio/x86_64/stable
          # Note the ref STARTS WITH "runtime/" (not "ext/"), so any pattern anchored at the bare app-id
          # fails. Anchor on the plugin-unique ".Plugin.atkAudio" substring AND require the trailing
          # "/x86_64/stable"; this cannot match the OBS platform ref "com.obsproject.Studio/x86_64/stable".
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "\.Plugin\.atkAudio/x86_64/stable$" || true)
          if [ -z "$REF" ]; then
            echo "ERROR: no ${ID} extension ref in export repo"; ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          echo "selected plugin ref $REF = $COMMIT"
          # Sanity: the commit must be a slim extension tree. The full OBS platform app has thousands of tree
          # entries; this plugin has far fewer. If we accidentally picked a huge tree, bail instead of
          # shipping a bloated bundle.
          N=$(ostree --repo=repo ls -R "$COMMIT" 2>/dev/null | wc -l)
          echo "plugin commit tree entries = $N"
          if [ "$N" -gt 2000 ]; then
            echo "ERROR: selected commit is unexpectedly large (${N} entries) -- not an extension"; exit 1
          fi
          rm -rf extrepo workdir
          # Checkout the extension tree into a FRESH archive-z2 repo that contains ONLY the extension objects
          # (no platform objects present). No runtime installed is needed for a plain archive-z2 ostree commit.
          ostree --repo=extrepo init --mode=archive-z2 >/dev/null 2>&1
          ostree --repo=repo checkout "$COMMIT" workdir >/dev/null 2>&1
          # Do NOT strip the [Runtime] block — a build-extension .metadata is:
          #   [Runtime]\nname=…\nsdk=…\n[ExtensionOf]\nruntime = com.obsproject.Studio/x86_64/stable\n…
          # The awk below deletes EVERYTHING between `[Runtime]` and the blank line, which removes BOTH the
          # name/sdk AND the REQUIRED runtime = com.obsproject.Studio line from [ExtensionOf]. That leaves an
          # extension with no declared OBS runtime → OBS refuses to load it ("won't install/open in OBS").
          # Keep the .metadata intact (OBS reads `runtime = com.obsproject.Studio/x86_64/stable` to bind the
          # extension to the running OBS host). This has zero size impact; the content-only ext/ ref still
          # prevents the OBS platform from being emitted as a static-delta base. Do nothing here.
          # Re-commit under a RUNTIME ref (runtime/<id>/...). flatpak REJECTS `ext/` refs on install
          # ("ext/... is not application or runtime") — that rejection was the original INSTALL-TIME failure.
          # A runtime/<id> ref installs cleanly with `flatpak install <file>.flatpak` and lands in the correct
          # OBS extension path (OBS recognizes the com.obsproject.Studio.Plugin.* prefix for its extension point).
          # This still bundles content-only: no --runtime-repo is passed, so the OBS platform objects are NOT
          # pulled into this archive-z2 bundle => stays slim (~10-17MB) while remaining installable.
          # CRITICAL: set the commit's extra-data so `flatpak install` deploy-time check
          # validate_commit_metadata() (flatpak-dir.c) passes. That function hard-fails when the
          # "xa.metadata" extra-data is NULL or its bytes differ from the deployed metadata file. A plain
          # `ostree commit` drops all extra-data, so the hand re-commit MUST carry:
          #   xa.ref       = runtime/<id>/x86_64/stable        (must equal the bundle ref)
          #   xa.metadata  = EXACT bytes of this extension's .metadata file (the tree's metadata)
          # build-bundle already reads workdir/metadata for the bundle HEADER "metadata" key; validate also
          # compares commit xa.metadata against the deployed (tree) metadata, so the stored string must be
          # byte-identical to workdir/metadata. ostree has no --metadata=keyfile mode; use add-metadata-string
          # with KEY=VALUE (value = everything after the first '='). Read the file bytes verbatim with
          # `IFS= read -r -d ''` so a trailing newline is preserved (command substitution would strip it and
          # break the byte match). flatpak stores xa.metadata as G_VARIANT_TYPE_STRING.
          META=""
          # NOTE: the checkout created a LOCAL dir named `workdir/` (relative), not a $WORKDIR env var.
          if [ -f "workdir/metadata" ]; then IFS= read -r -d '' META < "workdir/metadata" || true; fi
          echo "injected extension metadata bytes = ${#META}"
          FRESH=$(ostree --repo=extrepo commit --branch="runtime/${ID}/x86_64/stable" \
                    --subject="atkAudio plugin extension" \
                    --add-metadata-string="xa.ref=runtime/${ID}/x86_64/stable" \
                    --add-metadata-string="xa.metadata=${META}" \
                    workdir 2>/dev/null | tail -1)
          echo "fresh ext-only commit = $FRESH"
          # Generate a flatpak summary so Pages-hosted repo is consumable by flatpak over HTTP:
          # the client fetches summary.idx (not the raw objects). No signing key needed for install.
          ostree summary --update --repo=extrepo 2>&1 | tail -2
          echo "flatpak summary generated for extrepo/ (summary.idx)"
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "Building plain extension bundle for ${ID} (runtime ref, content-only) tag=${VER}"
          flatpak build-bundle extrepo atkAudioForOBS-${VER}.flatpak \
            "runtime/${ID}/x86_64/stable" stable
          ls -lh atkAudioForOBS-${VER}.flatpak
      - name: Verify bundle commit carries matching xa.metadata (validate_commit_metadata gate)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          # Rebuild the same ext-only commit + workdir here so this step is self-contained against extrepo/.
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "\.Plugin\.atkAudio/x86_64/stable$" || true)
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          rm -rf extrepo workdir
          ostree --repo=extrepo init --mode=archive-z2 >/dev/null 2>&1
          ostree --repo=repo checkout "$COMMIT" workdir >/dev/null 2>&1
          # Same byte-exact metadata injection as the bundle step must have produced.
          META=""
          if [ -f "workdir/metadata" ]; then IFS= read -r -d '' META < "workdir/metadata" || true; fi
          FRESH=$(ostree --repo=extrepo commit --branch="runtime/${ID}/x86_64/stable" \
                    --subject="atkAudio plugin extension verify" \
                    --add-metadata-string="xa.ref=runtime/${ID}/x86_64/stable" \
                    --add-metadata-string="xa.metadata=${META}" \
                    workdir 2>/dev/null | tail -1)
          # Read back the commit's extra-data and confirm xa.metadata == workdir/metadata bytes (the exact
          # contract validate_commit_metadata() enforces). If empty -> the gate would fail; fail loudly.
          if [ -z "$META" ]; then echo "ERROR: metadata file missing"; exit 1; fi
          echo "verifying commit $FRESH carries xa.metadata == $(wc -c < workdir/metadata) bytes"
          # Use ostree to extract the commit object and grep the embedded metadata string presence.
          OBJDIR="repo/objects/${FRESH:0:2}/${FRESH:2:2}"
          OBJ=$(find "$OBJDIR" -name "${FRESH:4}.commit" 2>/dev/null | head -1)
          if ! gzip -dc "$OBJ" 2>/dev/null | grep -qa "xa.metadata"; then
            echo "ERROR: xa.metadata NOT present on re-committed runtime ref"; exit 1
          fi
          echo "OK: xa.metadata present on runtime/${ID}/x86_64/stable commit"
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          path: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error
      - name: Publish ostree repo to GitHub Pages (for .flatpakref install)
        env:
          # A flatpak .flatpakref's [Connection] Endpoint must be a real ostree repo served over HTTP.
          # extrepo/ (archive-z2 + generated summary.idx) is the endpoint; flatpak fetches summary.idx,
          # objects/sha256/.. and refs/.. as static files from Pages. The .flatpak bundle alone CANNOT be
          # installed (flatpak rejects ext refs: "ext/... is not application or runtime"), so this Pages
          # repo is the actual install endpoint users hit via `flatpak install atkOBS2.flatpakref`.
          PAGES_REPO: com.obsproject.Studio.Plugin.atkAudio
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./extrepo

  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # Check out the repo so we can read the manifest (for the version) and build
      # the changelog from git history. fetch-depth: 0 is required so `git log` has
      # full history; the default shallow depth-1 clone yields only HEAD, producing an
      # empty changelog body. Plain checkout at the workflow ref is enough; a hardcoded
      # `ref:` broke on workflow_dispatch (no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # If a previous release tag exists, summarize commits since it; otherwise fall back to recent history.
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# atkAudio Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Emit .flatpakref (install endpoint)
        run: |
          VER="${{ steps.version.outputs.version }}"
          ID=com.obsproject.Studio.Plugin.atkAudio
          # The flatpak bundle CANNOT be installed directly (flatpak rejects ext refs).
          # This .flatpakref points at the Pages-hosted ostree repo published in the flatpak job.
          cat > atkOBS2.flatpakref <<EOF
          [Flatpak Ref]
          Ref=${ID}
          Arch=x86_64
          Branch=stable
          [Connection]
          Endpoint=https://madalee-com.github.io/com.obsproject.Studio.Plugin.atkAudio/
          EOF
          echo "--- atkOBS2.flatpakref ---"; cat atkOBS2.flatpakref
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: atkAudio Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            atkOBS2.flatpakref
            release/atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
      - name: Verify plain bundle (no static-delta metadata)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          F="release/atkAudioForOBS-${VER}.flatpak"
          ls -lh "$F"
          SIZE_BYTES=$(stat -c%s "$F")
          echo "  size_bytes=$SIZE_BYTES"
          # Size gate: a plain extension bundle's .files layer is ~17MB. Bloat (static-delta runtime rebuild)
          # pushed it to ~117MB, so fail loudly if it grows past the expected ceiling.
          if [ "$SIZE_BYTES" -gt 26214400 ]; then
            echo "ERROR: bundle larger than 25MB ($SIZE_BYTES bytes) — likely static-delta bloat"; exit 1
          fi
          # Static-delta bundles embed 'deltas/<ver>/<hash>/n' blob paths in the NUL-separated header.
          # grep is line-based and these live inside a binary header, so translate NULs to newlines first.
          # Use process substitution (not a pipe) so tr's SIGPIPE exit isn't caught by `set -o pipefail`
          # when grep -q matches early; otherwise the check would always report "no deltas" (false pass).
          # Real delta hashes contain '_' and '+', so [A-Za-z0-9]+ must be replaced by [^/]+ to match.
          # flatpak build-bundle ALWAYS emits one tiny benign delta even for a clean slim bundle, so only
          # fail when the bundle exceeds the slim target — i.e. real bloat (leaked runtime / stray copy).
          if grep -aqE 'deltas/[a-z]{2}/[^/]+/[^/]+' <(tr '\0' '\n' < "$F"); then
            if [ "$SIZE_BYTES" -gt 26214400 ]; then
              echo "ERROR: bundle contains large static deltas (>25MB, $SIZE_BYTES bytes) — runtime bloat"; exit 1
            fi
            echo "  note: tiny benign static delta present in slim bundle (expected), size within gate"
          fi
