on:
  workflow_dispatch:
name: CI Build Flatpak
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          bundle: atkAudio
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v5
      - name: Rename release file
        run: |
          mv atkAudio atkAudioForOBS-0.35.0.flatpak
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: atkAudio Plugin for OBS Flatpak 0.35.0
          preserve_order: true
          files: |
            atkAudioForOBS-0.35.0.flatpak