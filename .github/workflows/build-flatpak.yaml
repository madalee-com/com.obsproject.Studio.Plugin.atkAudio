on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # pushing v0.35.0 also triggers a build + auto-release
name: CI Build Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # atkAudio source tag (line 49 of the manifest) is the release version.
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          # Do NOT let the action auto-bundle: its `flatpak build-bundle --runtime --runtime-repo=<flathub>`
          # emits a static-delta ostree bundle (deltas/av/0..4 + update metadata) that bloats the release
          # artifact to ~100-117MB. We build the extension ourselves below and emit a plain ~17MB bundle.
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain extension bundle (no static-delta bloat). CRITICAL: do NOT add `--runtime` — that flag
      # makes flatpak generate a static-delta ostree bundle (`deltas/av/…`) rebuilding the full OBS
      # SDK/platform (~218MB x2), which is what bloated the artifact to ~117MB. Plain build-bundle emits just
      # the .files layer (~17MB).
      #
      # REF SPEC problem: build-extension:true emits an `ext/…` ref, NOT `app/<id>`. On flatpak 1.18.1 (this
      # image) `flatpak build-bundle` does NOT accept the full ext ref as NAME — `_repo_resolve_rev(repo,
      # "ext/...")` returns FALSE (the plain ext ref is not resolvable this way and there's no collection-id),
      # so it falls through to flatpak_is_valid_name("ext/...") which rejects "/" ("Name can't contain /").
      # The old bare-app-id approach also failed: build-bundle prefix-guesses `app/<name>` when NAME doesn't
      # resolve, but that app ref does not exist in the repo -> "Refspec 'app/…' not found".
      #
      # ROOT CAUSE of the previous CI failure (step 6 "Refspec not found"): flatpak-builder-action defaults
      # `branch` to `master`, so the exported ref is ext/<runtime>/<id>/x86_64/master, NOT .../stable. The old
      # step hardcoded x86_64/stable and hardcoded the exact ext ref, so `ostree rev-parse` could not find it.
      # FIX (verified in flatpak-github-actions:freedesktop-26.08): discover the exported ref DYNAMICALLY via
      # `ostree refs` (plain archive-mode repo, refs/heads/ext/<runtime>/<id>/x86_64/<branch>). Copy its
      # checksum file to an app/<id>/x86_64/<branch> path (same commit). Then bundle with the BARE app-id so
      # build-bundle constructs and resolves app/<id>/x86_64/<branch> itself — no "/" in NAME. `ostree add-ref`
      # / `--from` are unavailable in this image, but writing the checksum file works (plain archive repo).
      - name: Create app ref from ext ref (copy checksum file)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          # Discover the exported ext/<runtime>/<id>/x86_64/<branch> ref for THIS id, any branch.
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "/${ID}/x86_64/.+$" | head -1)
          if [ -z "$REF" ]; then
            echo "ERROR: no ext ref found for ${ID} in repo"; ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          echo "exported ref = $REF"
          BRANCH="${REF##*/}"
          APP_REF="app/${ID}/x86_64/${BRANCH}"
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          mkdir -p repo/refs/heads/app/${ID}/x86_64
          # Parent dir (…/x86_64) exists; write the checksum so the leaf filename is <branch>.
          printf '%s\n' "$COMMIT" > repo/refs/heads/$APP_REF
          echo "app ref $APP_REF -> $(ostree --repo=repo rev-parse "$APP_REF")"
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          BRANCH=$(ostree --repo=repo refs 2>/dev/null | grep -E "/${ID}/x86_64/.+$" | head -1 | sed 's#.*/##')
          echo "Building plain extension bundle for ${ID} branch=${BRANCH} tag=${VER}"
          flatpak build-bundle repo atkAudioForOBS-${VER}.flatpak "${ID}" "${BRANCH}"
          ls -lh atkAudioForOBS-${VER}.flatpak
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          path: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # Check out the repo so we can read the manifest (for the version) and build
      # the changelog from git history. fetch-depth: 0 is required so `git log` has
      # full history; the default shallow depth-1 clone yields only HEAD, producing an
      # empty changelog body. Plain checkout at the workflow ref is enough; a hardcoded
      # `ref:` broke on workflow_dispatch (no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # If a previous release tag exists, summarize commits since it; otherwise fall back to recent history.
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# atkAudio Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: atkAudio Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
      - name: Verify plain bundle (no static-delta metadata)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          F="release/atkAudioForOBS-${VER}.flatpak"
          ls -lh "$F"
          SIZE_BYTES=$(stat -c%s "$F")
          echo "  size_bytes=$SIZE_BYTES"
          # Size gate: a plain extension bundle's .files layer is ~17MB. Bloat (static-delta runtime rebuild)
          # pushed it to ~117MB, so fail loudly if it grows past the expected ceiling.
          if [ "$SIZE_BYTES" -gt 26214400 ]; then
            echo "ERROR: bundle larger than 25MB ($SIZE_BYTES bytes) — likely static-delta bloat"; exit 1
          fi
          # Static-delta bundles embed the 'deltas/<ver>/<hash>/n' blob paths in the NUL-separated header.
          # grep is line-based and these live inside a binary header, so translate NULs to newlines first.
          # Use process substitution (not a pipe) so tr's SIGPIPE exit isn't caught by `set -o pipefail`
          # when grep -q matches early; otherwise the check would always report "no deltas" (false pass).
          if grep -aqE 'deltas/[a-z]{2}/[A-Za-z0-9]+/[A-Za-z0-9]+' <(tr '\0' '\n' < "$F"); then
            echo "ERROR: bundle still contains static deltas"; exit 1
          fi
