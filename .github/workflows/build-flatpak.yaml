on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # pushing v0.35.0 also triggers a build + auto-release
name: CI Build Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # atkAudio source tag (line 49 of the manifest) is the release version.
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          # Do NOT let the action auto-bundle: its `flatpak build-bundle --runtime --runtime-repo=<flathub>`
          # emits a static-delta ostree bundle (deltas/av/0..4 + update metadata) that bloats the release
          # artifact to ~100-117MB. We build the extension ourselves below and emit a plain ~17MB bundle.
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain extension bundle (~17MB, no static-delta bloat).
      #
      # ROOT CAUSE of the 113MB artifact (CI run #..., v0.35.0): flatpak-builder-action --install-deps-from=flathub
      # pulls com.obsproject.Studio/x86_64/stable into the SAME export repo, and the extension commit's delta-base
      # is that platform. Any `flatpak build-bundle <repo> ...` over THAT repo emits static-delta BASE blobs (~218MB
      # x2 decompressed) embedded in the bundle -- even WITHOUT --runtime, because the platform objects are reachable
      # in the repo's object graph (static-delta bundling picks a reachable base). Decode of bloated.flatpak = ext
      # contentstream ~17MB + two identical 228MB platform base streams (~90MB bloat). Confirmed by inspecting the XZ
      # frame layout: header, ext frame, then two platform static-delta frames.
      #
      # FIX: build the bundle from a FRESH archive-z2 repo that contains ONLY the extension objects. Copy just the
      # extension commit checksum into a fresh repo (re-committed under its original runtime/<id> ref, so OBS still
      # recognises it as a plugin extension) and bundle from there. With no platform object present, nothing can be
      # emitted as a static-delta base => bundle is ~17MB with no deltas/av-style header paths. Verified on host
      # (flatpak 1.18.x / libostree 2026.x): `ostree checkout <ext-commit>` extracts the ext tree WITHOUT platform
      # files; re-commit into a fresh repo under the runtime ref id; `flatpak build-bundle` over that fresh repo with
      # the FULL runtime ref NAME produces a clean bundle. Plain archive-z2 repos need no runtime installed, so we
      # avoid flatpak build-init/-export (which require the OBS runtime) and use raw `ostree commit`.
      - name: Build extension-only repo (strip embedded OBS platform)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "/${ID}/x86_64/.+$" | head -1)
          if [ -z "$REF" ]; then
            echo "ERROR: no ext ref found for ${ID} in repo"; ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          echo "exported $REF = $COMMIT"
          rm -rf extrepo workdir
          # Fresh archive-z2 repo containing ONLY the extension objects (no platform present).
          ostree --repo=extrepo init --mode=archive-z2 >/dev/null 2>&1
          mkdir -p extrepo/refs/heads/runtime/${ID}/x86_64
          # Checkout the ext tree (platform files excluded) and re-commit under the SAME runtime ref id so OBS still
          # treats it as a plugin extension. bundle-bundle over this repo cannot embed the platform because its
          # objects are not present here.
          ostree --repo=repo checkout "$COMMIT" workdir >/dev/null 2>&1
          FRESH=$(ostree --repo=extrepo commit --branch="runtime/${ID}/x86_64/stable" \
                    --subject="atkAudio plugin extension" workdir 2>/dev/null | tail -1)
          echo "fresh ext-only commit = $FRESH"
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "Building plain extension bundle for ${ID} (ext-only repo) tag=${VER}"
          flatpak build-bundle extrepo atkAudioForOBS-${VER}.flatpak \
            "runtime/${ID}/x86_64/stable" stable
          ls -lh atkAudioForOBS-${VER}.flatpak
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          path: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # Check out the repo so we can read the manifest (for the version) and build
      # the changelog from git history. fetch-depth: 0 is required so `git log` has
      # full history; the default shallow depth-1 clone yields only HEAD, producing an
      # empty changelog body. Plain checkout at the workflow ref is enough; a hardcoded
      # `ref:` broke on workflow_dispatch (no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # If a previous release tag exists, summarize commits since it; otherwise fall back to recent history.
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# atkAudio Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: atkAudio Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
      - name: Verify plain bundle (no static-delta metadata)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          F="release/atkAudioForOBS-${VER}.flatpak"
          ls -lh "$F"
          SIZE_BYTES=$(stat -c%s "$F")
          echo "  size_bytes=$SIZE_BYTES"
          # Size gate: a plain extension bundle's .files layer is ~17MB. Bloat (static-delta runtime rebuild)
          # pushed it to ~117MB, so fail loudly if it grows past the expected ceiling.
          if [ "$SIZE_BYTES" -gt 26214400 ]; then
            echo "ERROR: bundle larger than 25MB ($SIZE_BYTES bytes) — likely static-delta bloat"; exit 1
          fi
          # Static-delta bundles embed the 'deltas/<ver>/<hash>/n' blob paths in the NUL-separated header.
          # grep is line-based and these live inside a binary header, so translate NULs to newlines first.
          # Use process substitution (not a pipe) so tr's SIGPIPE exit isn't caught by `set -o pipefail`
          # when grep -q matches early; otherwise the check would always report "no deltas" (false pass).
          if grep -aqE 'deltas/[a-z]{2}/[A-Za-z0-9]+/[A-Za-z0-9]+' <(tr '\0' '\n' < "$F"); then
            echo "ERROR: bundle still contains static deltas"; exit 1
          fi
