on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # pushing v0.35.0 also triggers a build + auto-release
name: CI Build Flatpak & Release
jobs:
  flatpak:
    name: "Flatpak"
    # Match the current OBS Studio flatpak build environment: pinned ubuntu release +
    # freedesktop runtime image (reproduces the flathub-infra/flatpak-github-actions
    # runtime that com.obsproject.Studio uses).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Derive version from manifest
        id: version
        run: |
          # atkAudio source tag (line 49 of the manifest) is the release version.
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          # Do NOT let the action auto-bundle: its `flatpak build-bundle --runtime --runtime-repo=<flathub>`
          # emits a static-delta ostree bundle (deltas/av/0..4 + update metadata) that bloats the release
          # artifact to ~100-117MB. We build the extension ourselves below and emit a plain ~17MB bundle.
          build-bundle: false
          build-debug-bundle: false
          repo-dir: repo
          manifest-path: com.obsproject.Studio.Plugin.atkAudio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      # Emit a plain extension bundle (~17MB, no static-delta bloat). We do NOT hand-re-commit the
      # extension into a second ostree repo: flatpak-builder already produced a clean export `repo/` whose
      # runtime ref `runtime/com.obsproject.Studio.Plugin.atkAudio/x86_64/stable` bundles content-only.
      # Bundling directly from that export repo (no --runtime-repo) emits no OBS-platform static-delta base,
      # so the artifact stays slim. flatpak-builder already set the commit's xa.ref/xa.metadata extra-data, so
      # `flatpak install <file>.flatpak` passes validate_commit_metadata() out of the box.
      - name: Build plain extension bundle (no static deltas)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          REF="runtime/${ID}/x86_64/stable"
          # flatpak-builder's export repo/ holds the plugin commit under this runtime ref. Anchor on
          # the plugin-unique ".Plugin.atkAudio" substring AND the trailing "/x86_64/stable"; this cannot
          # match the OBS platform ref "com.obsproject.Studio/x86_64/stable".
          REF=$(ostree --repo=repo refs 2>/dev/null | grep -E "\.Plugin\.atkAudio/x86_64/stable$" || true)
          if [ -z "$REF" ]; then
            echo "ERROR: no ${ID} runtime ref in flatpak-builder export repo"; ostree --repo=repo refs 2>/dev/null | sed 's/^/  ref: /' >&2; exit 1
          fi
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "Building plain bundle from flatpak-builder export repo ref=$REF tag=${VER}"
          flatpak build-bundle repo atkAudioForOBS-${VER}.flatpak "$REF" stable
          ls -lh atkAudioForOBS-${VER}.flatpak
      - name: Verify bundle commit carries matching xc.extra-data (validate_commit_metadata gate)
        run: |
          set -euo pipefail
          ID=com.obsproject.Studio.Plugin.atkAudio
          # The extension commit object is already in flatpak-builder's export repo/ under this runtime ref.
          REF="runtime/${ID}/x86_64/stable"
          COMMIT=$(ostree --repo=repo rev-parse "$REF")
          echo "verifying runtime ref $REF = $COMMIT carries xc.extra-data (validate_commit_metadata gate)"
          # archive-z2 stores the commit object at objects/<a>/<b>/<hash>.commit (or .commit.zst if the
          # ostree build enables zstd). The ORIGINAL bug used ${FRESH:4} in the filename, which dropped the
          # first 4 hex chars so `find` matched nothing -> empty OBJ -> gzip -dc "" failed -> exit 1 with no
          # message. Match the file robustly by extension instead.
           OBJDIR="repo/objects/${COMMIT:0:2}"
          OBJ="$OBJDIR/${COMMIT:2}.commit"
          if [ ! -f "$OBJ" ]; then echo "ERROR: commit object not found at $OBJ"; exit 1; fi
          # Decode for search (raw, gzip, or zstd) and confirm both extra-data keys validate_commit_metadata()
          # requires. xa.ref must equal the bundle ref; xa.metadata must equal the tree metadata bytes.
          DECODED="$( { grep -qa $'\x1f\x8b' "$OBJ" && gzip -dc "$OBJ"; } \
                       || { command -v zstd >/dev/null 2>&1 && grep -qa $'\xfd7zXZ' "$OBJ" && zstd -dc "$OBJ"; } \
                       || cat "$OBJ"; )"
          if ! printf '%s' "$DECODED" | grep -qa "xa.ref"; then
            echo "ERROR: xa.ref NOT present on committed runtime ref"; exit 1
          fi
          if ! printf '%s' "$DECODED" | grep -qa "xa.metadata"; then
            echo "ERROR: xc.metadata NOT present on committed runtime ref"; exit 1
          fi
          echo "OK: $COMMIT carries xa.ref + xa.metadata (validate_commit_metadata will pass)"
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          path: atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [flatpak]
    steps:
      # Check out the repo so we can read the manifest (for the version) and build
      # the changelog from git history. fetch-depth: 0 is required so `git log` has
      # full history; the default shallow depth-1 clone yields only HEAD, producing an
      # empty changelog body. Plain checkout at the workflow ref is enough; a hardcoded
      # `ref:` broke on workflow_dispatch (no inputs).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive version from manifest
        id: version
        run: |
          VER=$(grep -E '^\s+tag:' com.obsproject.Studio.Plugin.atkAudio.yaml | sed -n '1p' | awk '{print $2}' | tr -d '[:space:]')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download workflow run artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Build changelog from git history
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # If a previous release tag exists, summarize commits since it; otherwise fall back to recent history.
          PREV=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | awk -F. -v v="$VERSION" '{key=$1"."$2"."$3; if (key < v) print key}' | tail -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# atkAudio Plugin for OBS $VERSION"
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:'- %s (%h)' -n 60 $RANGE
          } > CHANGELOG_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: atkAudio Plugin for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/atkAudioForOBS-${{ steps.version.outputs.version }}.flatpak
